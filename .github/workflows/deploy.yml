name: Deploy

# **自動では動かさない。**push で勝手に公開されるのは、まだ非公開の
# プロジェクトにとって取り返しがつかない。公開すると決めた人が押す。
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'production へ出すか、preview に留めるか'
        required: true
        default: preview
        type: choice
        options: [preview, production]

permissions:
  contents: read

concurrency:
  # 同じ宛先へ同時に投げない。
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # **beta（beta.webts.app）は 0.4.0 でやめた。**beta ブランチから出すときは、アプリを
    # 作らず、beta-closed/ のお知らせだけを置く。beta の利用者がブックマークから来ても、
    # 本番へ移ればよいことが分かるように。
    env:
      BETA_CLOSED: ${{ github.ref_name == 'beta' }}
    steps:
      - name: The beta branch never goes to production
        if: github.ref_name == 'beta' && inputs.environment == 'production'
        run: |
          echo "::error::beta は本番に出さない（beta-closed のお知らせだけを preview の beta に置く）"
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish the beta-closed notice
        if: env.BETA_CLOSED == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy beta-closed --project-name=webts-app --branch=beta

      - uses: actions/setup-node@v4
        if: env.BETA_CLOSED != 'true'
        with:
          node-version: '24'
          cache: npm

      - uses: mymindstorm/setup-emsdk@v14
        if: env.BETA_CLOSED != 'true'
        with:
          version: 6.0.9
          actions-cache-folder: emsdk-cache

      - run: npm ci
        if: env.BETA_CLOSED != 'true'

      - name: Build the shipped WASM modules
        if: env.BETA_CLOSED != 'true'
        run: |
          npm run build:mpeg2
          npm run build:px4-identity
          npm run build:q3u4-descramble

      # リポジトリには入れず、デプロイのたびにプレクスのドライバから取り出す。
      # ZIP・.sys の固定ハッシュか上流の検証のどれかが合わなければ、ここで止まる。
      - name: Extract the IT930x firmware from the vendor driver
        if: env.BETA_CLOSED != 'true'
        run: npm run firmware

      # 配る前に全部通す。ここを省くと、壊れたものを公開できてしまう。
      - name: Verify vendor, typecheck, test and build
        if: env.BETA_CLOSED != 'true'
        run: npm run check

      - name: No binaries anywhere in history
        if: env.BETA_CLOSED != 'true'
        run: npm run history:check

      - name: The shipped output must contain the WASM
        if: env.BETA_CLOSED != 'true'
        run: |
          for module in mpeg2-decoder px4-identity q3u4-descramble; do
            test -f "dist/build/$module/$module.mjs" || { echo "::error::missing $module.mjs"; exit 1; }
            test -f "dist/build/$module/$module.wasm" || { echo "::error::missing $module.wasm"; exit 1; }
          done
          test "$(stat -c %s dist/firmware/it930x-firmware.bin)" = 2169             || { echo "::error::missing or wrong-sized firmware"; exit 1; }

      # 交差オリジン分離が無いと SharedArrayBuffer が使えず、pthread が動かず、
      # アプリは起動すらしない。**配信物にヘッダ設定が入っていることを確かめる。**
      - name: The cross-origin isolation headers must ship
        if: env.BETA_CLOSED != 'true'
        run: |
          grep -q 'Cross-Origin-Opener-Policy: same-origin' dist/_headers
          grep -q 'Cross-Origin-Embedder-Policy: require-corp' dist/_headers

      # GPL のソース提供義務と、何を配ったかの記録。
      - name: SBOM and corresponding source
        if: env.BETA_CLOSED != 'true'
        run: |
          npm run sbom
          npm run source-bundle

      - uses: actions/upload-artifact@v4
        if: env.BETA_CLOSED != 'true'
        with:
          name: release-${{ github.sha }}
          path: |
            dist/sbom.spdx.json
            dist/*-src.tar.gz
          retention-days: 90
          if-no-files-found: error

      # SBOM とソース bundle は記録として残すもので、配信物ではない。
      - name: Keep the release artefacts out of the upload
        if: env.BETA_CLOSED != 'true'
        run: rm -f dist/sbom.spdx.json dist/*-src.tar.gz

      - name: Publish to Cloudflare Pages
        if: env.BETA_CLOSED != 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist
            --project-name=webts-app
            --branch=${{ inputs.environment == 'production' && 'main' || github.ref_name }}
