# Cloudflare Pages（webts-app）の設定。deploy.yml の `wrangler pages deploy` が読む。
#
# 動作報告の保存先（D1）は本番と Preview（beta）の両方に結び付ける。本番は
# 利用者がオンにしたときだけ送る（src/reports/reports.ts）。
#
# database_id は秘密ではない。書き込めるのはこのプロジェクトの Functions だけ。

name = "webts-app"
pages_build_output_dir = "./dist"
compatibility_date = "2026-09-23"

[[d1_databases]]
binding = "REPORTS_DB"
database_name = "webts-beta-reports"
database_id = "25a7c0f0-70d6-42ef-86e3-646f6df9bd40"

